<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="100%" height="100%">
  <defs>
    <linearGradient id="ariesFaviconGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF3E00" />
      <stop offset="60%" stop-color="#FF7700" />
      <stop offset="100%" stop-color="#FFB300" />
    </linearGradient>
  </defs>
  <style>
    @media (prefers-color-scheme: light) {
      .bg-rect { fill: #0B0F19; }
    }
    @media (prefers-color-scheme: dark) {
      .bg-rect { fill: #080C14; }
    }
  </style>

  <!-- High-contrast rounded base -->
  <rect class="bg-rect" x="2" y="2" width="60" height="60" rx="16" ry="16" fill="#080C14" stroke="#FF7700" stroke-width="1.5" stroke-opacity="0.4" />

  <!-- Aries Ram Horns Routing Topology -->
  <!-- Left Horn -->
  <path d="M 32,46
           C 32,37 27,29 21,24
           C 16,19 10,21 9,26
           C 8,31 12,36 17,35
           C 20,34 22,31 21,29"
        fill="none"
        stroke="url(#ariesFaviconGrad)"
        stroke-width="4.5"
        stroke-linecap="round"
        stroke-linejoin="round" />

  <!-- Right Horn -->
  <path d="M 32,46
           C 32,37 37,29 43,24
           C 48,19 54,21 55,26
           C 56,31 52,36 47,35
           C 44,34 42,31 43,29"
        fill="none"
        stroke="url(#ariesFaviconGrad)"
        stroke-width="4.5"
        stroke-linecap="round"
        stroke-linejoin="round" />

  <!-- Center Stem -->
  <line x1="32" y1="36" x2="32" y2="52" stroke="url(#ariesFaviconGrad)" stroke-width="4.5" stroke-linecap="round" />

  <!-- Central Hub Node -->
  <circle cx="32" cy="36" r="3.5" fill="#FFFFFF" />
  <!-- Horn Endpoints -->
  <circle cx="21" cy="29" r="2" fill="#FFFFFF" />
  <circle cx="43" cy="29" r="2" fill="#FFFFFF" />
</svg>
