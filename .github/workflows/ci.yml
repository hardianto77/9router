name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Syntax check all JS sources
        run: |
          find . -name "*.js" -not -path "./node_modules/*" -not -path "./.next/*" -not -path "./.git/*" -exec node --check {} \;
          echo "all JS syntax OK"
