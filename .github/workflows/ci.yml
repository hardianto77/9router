name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Create local config placeholder
        run: |
          if [ ! -f open-sse/providers/oauth-clients.local.js ]; then
            cat > open-sse/providers/oauth-clients.local.js <<'EOF'
          // CI placeholder: real file is gitignored and provisioned at deploy time.
          module.exports = {};
          EOF
          fi

      - name: Lint
        run: npm run lint --if-present

      - name: Build
        run: npm run build --if-present
